# 애플리케이션 식별 명칭 설정
spring.application.name=ReciLog
# 내장 웹 서버 실행 포트 지정
server.port=8080

# 오라클 클라우드 MySQL 데이터베이스 드라이버 및 접속 URL 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# WARNING: '오라클클라우드_공용IP' 및 'DB비밀번호'를 본인의 오라클 클라우드 IP 및 설정한 비밀번호로 변경하세요.
spring.datasource.url=jdbc:mysql://168.107.24.114:3306/recipicdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
spring.datasource.username=recipic
spring.datasource.password=1020

# H2 콘솔 비활성화 (실제 MySQL DB 사용)
spring.h2.console.enabled=false

# JPA 방언 및 스키마 자동 생성 설정
# DBeaver에서 이미 schema.sql과 data.sql을 실행했으므로 ddl-auto는 none으로 지정
spring.jpa.hibernate.ddl-auto=none
# 실행되는 SQL 쿼리문을 콘솔 로그에 출력
spring.jpa.show-sql=true
# 콘솔에 출력되는 SQL 쿼리를 읽기 쉬운 가독성 높은 형태로 포맷팅
spring.jpa.properties.hibernate.format_sql=true
# Hibernate 방언(Dialect)을 MySQL 8로 지정
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 이미 DBeaver를 통해 스키마와 초깃값을 직접 실행했으므로 스크립트 자동 초기화는 never로 설정
spring.sql.init.mode=never